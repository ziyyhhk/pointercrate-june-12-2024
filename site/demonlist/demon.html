<style>
  .demon-wrap{max-width:900px;margin:0 auto;padding:0 12px}
  .demon-crumb{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#8a8a90;margin:18px 0 10px}
  .demon-crumb a{color:#0881c6;text-decoration:none}
  .demon-head h1{font-size:30px;margin:0 0 2px;line-height:1.15}
  .demon-head .by{font-size:16px;color:#555;margin:0 0 14px}
  .demon-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 10px;border-radius:20px;margin-bottom:14px}
  .badge-main{background:#e6f4ea;color:#1e7e34}
  .badge-ext{background:#e7f1fb;color:#0b62b0}
  .badge-legacy{background:#f3e8fb;color:#7d3cc0}
  .video-frame{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:6px;overflow:hidden;margin:6px 0 4px}
  .video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .video-thumb{position:absolute;inset:0;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .video-thumb .play-btn{width:68px;height:48px;background:rgba(20,20,20,.8);border-radius:12px;display:flex;align-items:center;justify-content:center;transition:background .15s}
  .video-thumb:hover .play-btn{background:#f00}
  .video-thumb .play-btn::after{content:"";border-style:solid;border-width:11px 0 11px 19px;border-color:transparent transparent transparent #fff;margin-left:4px}
  .video-cap{font-size:11.5px;color:#8a8a90;margin:2px 0 0}
  .demon-note{margin:14px 0 0;padding:11px 13px;border-left:3px solid #0881c6;background:rgba(8,129,198,.06);
    font-size:12.5px;color:#5a5a60;line-height:1.5;border-radius:0 4px 4px 0}
  .demon-note a{color:#0881c6}
  .demon-nav{display:flex;justify-content:space-between;gap:10px;margin:16px 0 30px;flex-wrap:wrap}
  .demon-nav a{flex:1;min-width:200px;text-decoration:none;color:#333;padding:12px 14px;border:1px dashed #cfcfd4;border-radius:6px;background:#fff;transition:border-color .15s,background .15s}
  .demon-nav a:hover{border-color:#0881c6;background:#f7fbff}
  .demon-nav .dir{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#8a8a90;margin-bottom:3px}
  .demon-nav .nm{font-weight:700;font-size:14px}
  .demon-nav .next{text-align:right}
  .demon-missing{text-align:center;padding:60px 20px;color:#777}
  @media(max-width:600px){.demon-head h1{font-size:23px}}
</style>
